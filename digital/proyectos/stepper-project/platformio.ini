; Proyecto: Control Stepper 28BYJ-48 con ESP32 Super Mini
; Documentación PlatformIO: https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-supermini]
platform = espressif32
; La ESP32 Super Mini suele traer un chip ESP32-S3 (verifica la tuya).
; Si tu placa NO aparece en la lista de VS Code/PlatformIO tal cual,
; usa "esp32dev" como board genérica (funciona en la mayoria de módulos ESP32).
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Descomenta y ajusta si el puerto no se detecta automáticamente
; upload_port = COM5
; monitor_port = COM5
